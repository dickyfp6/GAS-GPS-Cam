<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LKMM TM ITS JEJAK 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Butterfly Container -->
  <div class="butterfly-container"></div>

  <!-- Logo Overlay -->
  <div class="logo-overlay">
    <img src="Logo Atas.png" alt="LKMM TM ITS JEJAK 2026" class="logo-image">
  </div>

  <!-- Main Content -->
  <main class="main-content">
    <div class="content-wrapper">
      <!-- Main App Panel (Header + Camera + Form) -->
      <div class="container main-app-panel">
        <div class="header-section">
          <h2 class="main-title">LKMM-TM XIX "JEJAK" 2026</h2>
          <p id="statusMsg" class="status-msg">Menyiapkan kamera dan lokasi...</p>
        </div>

        <!-- Camera Section -->
        <div class="camera-section">
          <div class="camera-wrapper">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="canvas" style="display: none;"></canvas>
            <div id="liveOverlay" class="live-overlay">
              <div id="overlayAddress" style="font-weight: bold;">Mencari lokasi...</div>
              <div id="overlayMeta" style="font-size: 0.75rem; margin-top: 4px;">
                <span id="overlayCoords">Lat: - | Long: -</span> • <span id="overlayTime"></span>
              </div>
            </div>
          </div>
        </div>

        <!-- Form Section -->
        <div class="form-section">
          <div class="form-inputs-row">
            <div class="form-group">
              <label>Pilih ORMAWA</label>
              <select id="ormawa">
                <option value="">Memuat data...</option>
              </select>
            </div>

            <div class="form-group" id="ormawaCustomGroup" style="display: none;">
              <label>Isi ORMAWA Lainnya</label>
              <input type="text" id="ormawaCustom" placeholder="Masukkan nama ORMAWA" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
            </div>
            
            <div class="form-group">
              <label>Nama Lengkap</label>
              <input type="text" id="nama" placeholder="Masukkan nama Anda" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false">
            </div>
          </div>
          
          <div id="actionArea">
            <button id="captureBtn" class="btn-primary" disabled>📸 Ambil Foto</button>
            <div id="postCapture" style="display: none; gap: 10px; flex-direction: row;">
              <button id="submitBtn" class="btn-success">✅ Kirim Data</button>
              <button id="retakeBtn" class="btn-secondary">🔄 Foto Ulang</button>
            </div>
          </div>
          
          <div id="result" class="result-box" style="display: none;"></div>
        </div>
      </div>

      <div class="container side-panel">
        <div class="log-header">
          <h3 class="side-title">Log Kehadiran</h3>
          <p class="side-subtitle">Terbaru hari ini</p>
        </div>
        <div id="presenceLogs" class="logs-container">
          <div class="log-loading">Memuat data...</div>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
