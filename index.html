<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Presensi Onsite Live</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>📸 Presensi Onsite</h1>
    
    <div class="form-group">
      <select id="ormawa" required>
        <option value="" disabled selected>Pilih ORMAWA Anda...</option>
        </select>
    </div>

    <div class="form-group">
      <input type="text" id="nama" placeholder="Masukkan Nama Lengkap" required autocomplete="off">
    </div>
    
    <div class="camera-section">
      <div class="camera-wrapper" id="cameraWrapper">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas" style="display: none;"></canvas>
        
        <div id="liveOverlay" class="live-overlay">
          <div class="overlay-text" id="overlayAddress">Mencari lokasi... pastikan GPS aktif.</div>
          <div class="overlay-text" id="overlayCoords">Lat: - | Long: -</div>
          <div class="overlay-text" id="overlayTime"></div>
        </div>
      </div>
      
      <div id="statusMsg" class="status-msg">Meminta izin kamera & lokasi...</div>
      
      <div class="action-buttons">
        <button id="captureBtn" class="btn-capture" disabled>📸 Ambil Foto</button>
        <button id="retakeBtn" class="btn-retake" style="display: none;">🔄 Ulangi</button>
        <button id="submitBtn" class="btn-submit" style="display: none;">✅ Kirim Presensi</button>
      </div>
    </div>
    
    <div id="result" class="result"></div>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
